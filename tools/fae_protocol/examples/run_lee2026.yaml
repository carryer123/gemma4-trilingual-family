# Pre-registration of the N=1 case study reported in the companion paper.
# This file is real and used for §5.6.

fae_preregistration:
  date: 2026-05-08
  protocol_version: 1.0
  language_triple:
    L1_A: ru
    L1_B: ko
    bridge: [en]
  household:
    n_l1_a_speakers: 1
    n_l1_b_speakers: 1
    children:
      - {age_months: 21, l1: ko, observe_only: true}
  models_compared:
    - {id: gemma-4-E2B-it, variant: stock, source: hf://unsloth/gemma-4-E2B-it}
    - {id: gemma-4-E2B-it, variant: LoRA-v1, adapter_path: lora_out/lora_v1/adapter}
    - {id: gemma-4-E2B-it, variant: LoRA-v2, adapter_path: lora_out/lora_v2/adapter}
  evaluators:
    A: {role: L1_A, name_pseudonym: P1, native_language: ru, target_language: ko, bridge: en}
    B: {role: L1_B, name_pseudonym: P2, native_language: ko, target_language: ru, bridge: en}
    C: {role: child_observer, n_minutes: 5, recording: parental_handwritten_notes}
  probe_set:
    file: tools/fae_protocol/probes_v1.jsonl
    sha256: <generated at submission>
    n_probes: 30
  stop_criterion: all_probes_scored_by_both_adults
  claim_tier: 1
  ethics_scope: own_household_only_no_irb_needed
  local_tag_extensions: []
